<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About PhenomApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 1.5rem;
      user-select: none;
      -webkit-user-select: none;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      padding: 2rem 2rem 1.75rem;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 0.2rem;
    }
    .version {
      font-size: 0.7rem;
      color: #9ca3af;
      margin-bottom: 1.5rem;
      letter-spacing: 0.03em;
    }
    .license {
      font-size: 0.78rem;
      color: #6b7280;
      line-height: 1.7;
    }
    .license a {
      color: #4f46e5;
      text-decoration: none;
    }
    .license a:hover {
      text-decoration: underline;
    }
    .cc-icons {
      display: inline-flex;
      align-items: center;
      gap: 0.15rem;
      vertical-align: middle;
      margin-left: 0.25rem;
    }
    .cc-icons img {
      width: 1em;
      height: 1em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PhenomApp</h1>
    <p class="version">Version 1.0.0</p>
    <p class="license">
      <a href="https://github.com/cmeals2507/phenomapp">Phenom App</a> &copy; 2026 by
      <a href="https://github.com/cmeals2507">Cory Meals</a> is licensed under
      <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International</a><span class="cc-icons"><img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="CC"><img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="BY"><img src="https://mirrors.creativecommons.org/presskit/icons/nc.svg" alt="NC"><img src="https://mirrors.creativecommons.org/presskit/icons/sa.svg" alt="SA"></span>
    </p>
  </div>
</body>
</html>
